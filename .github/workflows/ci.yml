name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Fetching repository
      - uses: actions/checkout@v4

      # Installing node
      - uses: actions/setup-node@v4
        with:
          # Using the same node version as in the project
          node-version-file: '.nvmrc'

      # Java is required for the Firestore emulator
      - name: Set up Java (required for Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache
      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Cache Cypress binary
        uses: actions/cache@v3
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            cypress-binary-

      - name: Cache Firebase emulators
        uses: actions/cache@v3
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      # Dependencies
      - run: corepack enable
      - run: pnpm install

      # Installing cypress
      - run: pnpm exec cypress install

      # Checks:
      - run: pnpm run lint
      - run: pnpm run typecheck

      # Build:
      - run: pnpm run build

      # Tests
      - run: pnpm run coverage

      - run: pnpm run test:e2e
        env:
          VITE_USE_FIREBASE_EMULATOR: 'true'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      # Coverage artifact upload
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
