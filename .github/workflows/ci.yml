name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Fetching repository
      - uses: actions/checkout@v4

      # Installing node
      - uses: actions/setup-node@v4
        with:
          # Using the same node version as in the project
          node-version-file: '.nvmrc'

      # Cache
      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Cache Cypress binary
        uses: actions/cache@v3
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            cypress-binary-

      # Dependencies
      - run: corepack enable
      - run: pnpm install

      # Installing cypress
      - run: pnpm exec cypress install

      # Checks:
      - run: npm run lint
      - run: npm run typecheck

      # Build:
      - run: npm run build

      # Tests
      - run: npm run test

      # Todo: Create coverage artifact

      - run: npm run e2e:ci
